<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>李萌的个人博客</title>
    <style>
        body {
            text-align: center;
            margin-top: 50px;
            font-family: "Microsoft Yahei", sans-serif;
        }
        /* 图片容器：实现并排 */
        .img-container {
            display: flex;
            justify-content: center;
            gap: 20px; /* 两张图片之间的间距 */
            margin-top: 30px;
        }
        img {
            width: 300px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>计算机科学与技术236班 李萌 个人博客</h1>

    <div class="img-container">
        <!-- 相对路径图片（本地上传） -->
        <div>
            <h3>① 相对路径图片</h3>
            <img src="images/me.png" alt="我的照片">
        </div>
        <!-- 绝对路径图片（自定义网络地址） -->
        <div>
            <h3>② 绝对路径图片</h3>
            <img src="https://img2.baidu.com/it/u=3081112601,245213028&fm=253&app=138&f=JPEG?w=800&h=800" alt="网络图片">
        </div>
    </div>
</body>
</html>
