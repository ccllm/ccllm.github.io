<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>李萌的个人博客</title>
    <style>
        body {
            text-align: center;
            margin-top: 50px;
            font-family: "Microsoft Yahei", sans-serif;
        }
        .img-container {
            display: flex;
            justify-content: center;
            gap: 40px; /* 两张图之间的间距 */
            margin-top: 30px;
        }
        img {
            width: 300px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>计算机科学与技术236班 李萌 个人博客</h1>

    <div class="img-container">
        <!-- 相对路径图片 -->
        <div>
            <h3>① 相对路径图片（本地上传）</h3>
            <img src="images/me.png" alt="我的照片">
        </div>
        <!-- 绝对路径图片（稳定可用） -->
        <div>
            <h3>② 绝对路径图片（网络地址）</h3>
          <img src="https://tuimeizi.cn/girl/300x300" alt="随机美女图片">
        </div>
    </div>
</body>
</html>
